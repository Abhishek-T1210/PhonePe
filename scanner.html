<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Scan QR - PhonePe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      color: white;
      z-index: 10;
    }
    .close-btn {
      font-size: 28px;
      cursor: pointer;
      font-weight: 300;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
    }
    .help-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Video Container */
    #reader {
      width: 100%;
      height: 100%;
    }
    #reader video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Dark Overlay Outside Scan Area */
    .scan-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 5;
    }

    /* Centered Scanner Container */
    .scan-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      text-align: center;
      z-index: 6;
    }

    .scan-area {
      width: 280px;
      height: 280px;
      background: transparent;
      border-radius: 24px;
      position: relative;
    }

    /* Thin Static Purple Rounded Corner Brackets ONLY */
    .corner-bracket {
      position: absolute;
      width: 40px;
      height: 40px;
    }

    .top-left {
      top: 0;
      left: 0;
      border-top: 5px solid #68217A;
      border-left: 5px solid #68217A;
      border-top-left-radius: 20px;
    }
    .top-right {
      top: 0;
      right: 0;
      border-top: 5px solid #68217A;
      border-right: 5px solid #68217A;
      border-top-right-radius: 20px;
    }
    .bottom-left {
      bottom: 0;
      left: 0;
      border-bottom: 5px solid #68217A;
      border-left: 5px solid #68217A;
      border-bottom-left-radius: 20px;
    }
    .bottom-right {
      bottom: 0;
      right: 0;
      border-bottom: 5px solid #68217A;
      border-right: 5px solid #68217A;
      border-bottom-right-radius: 20px;
    }

    /* Buttons Directly Below Scanner */
    .bottom-controls {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 60px;
    }

    .control-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-size: 14px;
      gap: 8px;
      cursor: pointer;
    }

    .control-icon {
      width: 56px;
      height: 56px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-icon img {
      width: 28px;
      height: 28px;
      filter: brightness(0) invert(1);
    }

    /* Logo */
    .logo {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="close-btn" onclick="window.history.back()">×</div>
    <div class="title">Scan any QR</div>
    <div class="help-icon">?</div>
  </div>

  <!-- QR Scanner Video -->
  <div id="reader"></div>

  <!-- Dark Overlay -->
  <div class="scan-overlay"></div>

  <!-- Your Custom Scanner + Buttons -->
  <div class="scan-container">
    <div class="scan-area">
      <div class="corner-bracket top-left"></div>
      <div class="corner-bracket top-right"></div>
      <div class="corner-bracket bottom-left"></div>
      <div class="corner-bracket bottom-right"></div>
    </div>

    <div class="bottom-controls">
      <div class="control-btn" id="upload-btn">
        <div class="control-icon">
          <img src="https://img.icons8.com/ios-filled/50/ffffff/image.png" alt="Upload">
        </div>
        Upload QR
      </div>
      <div class="control-btn" id="torch-btn">
        <div class="control-icon">
          <img src="https://img.icons8.com/ios-filled/50/ffffff/flashlight.png" alt="Torch">
        </div>
        Torch
      </div>
    </div>
  </div>

  <!-- Logo -->
  <div class="logo">BHIM | UPI</div>

  <!-- html5-qrcode Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    const html5QrCode = new Html5Qrcode("reader");

    // REMOVED qrbox from config → no more default white/gray scan box
    const config = {
      fps: 10,
      aspectRatio: 1,
      facingMode: "environment" // Back camera
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        alert("QR Scanned Successfully:\n" + decodedText);
        html5QrCode.stop();
      },
      () => {}
    ).catch((err) => {
      alert("Camera access denied: " + err);
    });

    // Torch Toggle
    let torchOn = false;
    document.getElementById("torch-btn").addEventListener("click", () => {
      torchOn = !torchOn;
      html5QrCode.applyVideoConstraints({
        advanced: [{ torch: torchOn }]
      }).catch(() => {});
    });

    // Upload QR
    document.getElementById("upload-btn").addEventListener("click", () => {
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*";
      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          html5QrCode.scanFileV2(file, true)
            .then((result) => alert("QR from image:\n" + result.text))
            .catch(() => alert("No QR code found."));
        }
      };
      fileInput.click();
    });
  </script>

</body>
</html>
