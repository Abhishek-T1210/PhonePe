<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Scan QR - PhonePe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* Scanner View Container */
    #scanner-view {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      color: white;
      z-index: 10;
    }
    .close-btn {
      font-size: 28px;
      cursor: pointer;
      font-weight: 300;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
    }
    .help-icon {
      width: 26px;
      height: 26px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* Video Container */
    #reader {
      width: 100%;
      height: 100%;
    }
    #reader video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Dark Overlay */
    .scan-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      background: rgba(0, 0, 0, 0.1);
    }

    /* Transparent cutout - moved up from center */
    .scan-overlay::before {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      left: 50%;
      top: 38%;                     /* Moved up (was 50%) */
      margin-left: -140px;
      margin-top: -140px;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
      border-radius: 24px;
    }

    /* Scanner frame for corner brackets - same positioning */
    .scan-frame {
      position: absolute;
      width: 280px;
      height: 280px;
      left: 50%;
      top: 38%;                     /* Same as overlay */
      margin-left: -140px;
      margin-top: -140px;
      pointer-events: none;
      z-index: 6;
    }

    .scan-area {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 24px;
    }

    /* Purple Corner Brackets */
    .corner-bracket {
      position: absolute;
      width: 40px;
      height: 40px;
      pointer-events: none;
    }

    .top-left {
      top: 0;
      left: 0;
      border-top: 5px solid #68217A;
      border-left: 5px solid #68217A;
      border-top-left-radius: 20px;
    }
    .top-right {
      top: 0;
      right: 0;
      border-top: 5px solid #68217A;
      border-right: 5px solid #68217A;
      border-top-right-radius: 20px;
    }
    .bottom-left {
      bottom: 0;
      left: 0;
      border-bottom: 5px solid #68217A;
      border-left: 5px solid #68217A;
      border-bottom-left-radius: 20px;
    }
    .bottom-right {
      bottom: 0;
      right: 0;
      border-bottom: 5px solid #68217A;
      border-right: 5px solid #68217A;
      border-bottom-right-radius: 20px;
    }

    /* Bottom controls - smaller buttons, closer to scanner */
    .bottom-controls {
      position: absolute;
      left: 50%;
      top: 40%;                     /* Align with scanner */
      margin-top: 150px;            /* 280/2 + small extra space = ~150px below center of scanner */
      margin-left: -100px;          /* Rough centering adjustment */
      display: flex;
      justify-content: center;
      gap: 44px;                    /* Reduced gap from 60px */
      pointer-events: auto;
      z-index: 7;
      width: 200px;
    }

    .control-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-size: 13px;              /* Slightly smaller text */
      gap: 6px;                     /* Reduced gap */
      cursor: pointer;
    }

    .control-icon {
      width: 48px;                  /* Smaller icon circle (was 56px) */
      height: 48px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-icon img {
      width: 24px;                  /* Smaller icons */
      height: 24px;
      filter: brightness(0) invert(1);
    }

    /* Logo */
    .logo {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      z-index: 10;
    }

    /* Payment Interface - unchanged */
    .payment-interface {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #f5f5f5;
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .payment-interface.active {
      display: flex;
    }

    .payment-header {
      background: #5f259f;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .payment-back-btn {
      font-size: 24px;
      cursor: pointer;
    }

    .payment-title {
      font-size: 18px;
      font-weight: 600;
    }

    .payment-content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .payee-card {
      background: white;
      padding: 20px;
      margin: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .payee-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #00bfa5;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      margin: 0 auto 12px;
    }

    .payee-name {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .payee-upi {
      font-size: 14px;
      color: #666;
      text-align: center;
    }

    .verification-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 8px;
      font-size: 12px;
      color: #4caf50;
    }

    .input-section {
      background: white;
      padding: 20px;
      margin: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .input-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .amount-input {
      width: 100%;
      border: none;
      font-size: 32px;
      font-weight: 600;
      padding: 8px 0;
      outline: none;
    }

    .message-input {
      width: 100%;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .message-input:focus {
      border-color: #5f259f;
    }

    .pay-button {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #5f259f;
      color: white;
      border: none;
      padding: 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
    }

    .pay-button:active {
      background: #4a1d7a;
    }

    .pay-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .error-message {
      color: #f44336;
      font-size: 12px;
      margin-top: 4px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .info-label {
      color: #666;
    }

    .info-value {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Scanner View -->
  <div id="scanner-view">
    <div class="top-bar">
      <div class="close-btn" onclick="window.history.back()">×</div>
      <div class="title">Scan any QR</div>
      <div class="help-icon">?</div>
    </div>

    <div id="reader"></div>
    <div class="scan-overlay"></div>

    <!-- Scanner frame with corners -->
    <div class="scan-frame">
      <div class="scan-area">
        <div class="corner-bracket top-left"></div>
        <div class="corner-bracket top-right"></div>
        <div class="corner-bracket bottom-left"></div>
        <div class="corner-bracket bottom-right"></div>
      </div>
    </div>

    <!-- Bottom controls - smaller and closer -->
    <div class="bottom-controls">
      <div class="control-btn" id="upload-btn">
        <div class="control-icon">
          <img src="https://img.icons8.com/ios/50/FFFFFF/picture.png" alt="Upload">
        </div>
        Upload QR
      </div>
      <div class="control-btn" id="torch-btn">
        <div class="control-icon">
          <img src="https://img.icons8.com/external-kiranshastry-lineal-kiranshastry/64/FFFFFF/external-torch-interface-kiranshastry-lineal-kiranshastry.png" alt="Torch">
        </div>
        Torch
      </div>
    </div>

    <div class="logo">BHIM | UPI</div>
  </div>

  <!-- Payment Interface -->
  <div class="payment-interface" id="payment-view">
    <div class="payment-header">
      <div class="payment-back-btn" onclick="backToScanner()">←</div>
      <div class="payment-title">Pay</div>
      <div style="flex: 1"></div>
      <div class="help-icon">?</div>
    </div>

    <div class="payment-content">
      <div class="payee-card">
        <div class="payee-avatar" id="payee-avatar">AT</div>
        <div class="payee-name" id="payee-name">ABHISHEK VIJAYSHANKAR TIWARI</div>
        <div class="payee-upi" id="payee-upi">9819833605-3@ybl</div>
        <div class="verification-badge">
          <span>✓</span>
          <span>Banking Name Verified</span>
        </div>
      </div>

      <div class="input-section">
        <div class="input-label">₹ Enter Amount</div>
        <input type="number" class="amount-input" id="amount-input" placeholder="0" step="0.01" min="0">
        <div class="error-message" id="amount-error"></div>
      </div>

      <div class="input-section">
        <div class="input-label">Add a message (optional)</div>
        <input type="text" class="message-input" id="message-input" placeholder="Enter message">
      </div>

      <div class="input-section" id="qr-details" style="display: none;">
        <div class="info-row">
          <span class="info-label">Transaction Note:</span>
          <span class="info-value" id="txn-note">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Transaction Ref:</span>
          <span class="info-value" id="txn-ref">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Merchant Code:</span>
          <span class="info-value" id="merchant-code">-</span>
        </div>
      </div>
    </div>

    <button class="pay-button" id="pay-btn" onclick="processPay()">PROCEED TO PAY</button>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    let html5QrCode = null;
    let currentUpiData = null;

    // Parse UPI QR Code
    function parseUpiQr(qrString) {
      console.log("Raw QR:", qrString);
      
      // Check if it's a UPI QR
      if (!qrString.toLowerCase().startsWith('upi://pay')) {
        throw new Error('Not a valid UPI QR code');
      }

      // Extract query parameters
      const url = new URL(qrString.replace('upi://', 'https://'));
      const params = new URLSearchParams(url.search);

      const upiData = {
        pa: params.get('pa') || '',  // Payee address (VPA)
        pn: params.get('pn') || '',  // Payee name
        am: params.get('am') || '',  // Amount
        cu: params.get('cu') || 'INR',  // Currency
        tn: params.get('tn') || '',  // Transaction note
        tr: params.get('tr') || '',  // Transaction reference
        mc: params.get('mc') || '',  // Merchant code
        tid: params.get('tid') || '',  // Transaction ID
        url: params.get('url') || '',  // URL for bill
        mam: params.get('mam') || ''  // Minimum amount
      };

      // Decode URL-encoded values
      upiData.pn = decodeURIComponent(upiData.pn).replace(/\+/g, ' ');
      upiData.tn = decodeURIComponent(upiData.tn).replace(/\+/g, ' ');

      // Validate required fields
      if (!upiData.pa || !upiData.pn) {
        throw new Error('Missing required UPI fields (pa or pn)');
      }

      console.log("Parsed UPI Data:", upiData);
      return upiData;
    }

    // Show payment interface
    function showPaymentInterface(upiData) {
      currentUpiData = upiData;

      // Update payee details
      const initials = upiData.pn.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('payee-avatar').textContent = initials;
      document.getElementById('payee-name').textContent = upiData.pn.toUpperCase();
      document.getElementById('payee-upi').textContent = upiData.pa;

      // Pre-fill amount if provided
      const amountInput = document.getElementById('amount-input');
      if (upiData.am && upiData.am !== '') {
        amountInput.value = parseFloat(upiData.am).toFixed(2);
        amountInput.disabled = true;  // Fixed amount in dynamic QR
      } else {
        amountInput.value = '';
        amountInput.disabled = false;  // Editable for static QR
      }

      // Show additional details if available
      const detailsSection = document.getElementById('qr-details');
      if (upiData.tn || upiData.tr || upiData.mc) {
        detailsSection.style.display = 'block';
        document.getElementById('txn-note').textContent = upiData.tn || '-';
        document.getElementById('txn-ref').textContent = upiData.tr || '-';
        document.getElementById('merchant-code').textContent = upiData.mc || '-';
      } else {
        detailsSection.style.display = 'none';
      }

      // Pre-fill message if provided
      if (upiData.tn) {
        document.getElementById('message-input').value = upiData.tn;
      }

      // Show payment view
      document.getElementById('scanner-view').style.display = 'none';
      document.getElementById('payment-view').classList.add('active');
    }

    // Back to scanner
    function backToScanner() {
      document.getElementById('payment-view').classList.remove('active');
      document.getElementById('scanner-view').style.display = 'block';
      currentUpiData = null;
      startScanner();
    }

    // Process payment
    function processPay() {
      const amount = document.getElementById('amount-input').value;
      const message = document.getElementById('message-input').value;
      const errorEl = document.getElementById('amount-error');

      // Validate amount
      if (!amount || parseFloat(amount) <= 0) {
        errorEl.textContent = 'Please enter a valid amount';
        return;
      }

      // Check minimum amount if specified
      if (currentUpiData.mam && parseFloat(amount) < parseFloat(currentUpiData.mam)) {
        errorEl.textContent = `Minimum amount is ₹${currentUpiData.mam}`;
        return;
      }

      errorEl.textContent = '';

      // Prepare payment data
      const paymentData = {
        ...currentUpiData,
        amount: parseFloat(amount),
        message: message,
        timestamp: new Date().toISOString()
      };

      // In production, this would trigger actual UPI payment
      console.log("Payment Data:", paymentData);
      alert(`Payment Initiated!\n\nPayee: ${paymentData.pn}\nUPI ID: ${paymentData.pa}\nAmount: ₹${paymentData.amount}\n\nNote: This is a demo. In production, this would trigger the UPI payment flow.`);
      
      // Reset and go back
      backToScanner();
    }

    // Start scanner
    function startScanner() {
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
      }

      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        aspectRatio: 1,
        facingMode: "environment"
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          try {
            html5QrCode.stop();
            const upiData = parseUpiQr(decodedText);
            showPaymentInterface(upiData);
          } catch (error) {
            alert("Error: " + error.message + "\n\nPlease scan a valid UPI QR code.");
            console.error(error);
          }
        },
        () => {}
      ).catch((err) => {
        alert("Camera access denied: " + err);
      });
    }

    // Initialize on load
    startScanner();

    // Torch Toggle
    let torchOn = false;
    document.getElementById("torch-btn").addEventListener("click", () => {
      if (!html5QrCode) return;
      torchOn = !torchOn;
      html5QrCode.applyVideoConstraints({
        advanced: [{ torch: torchOn }]
      }).catch(() => {});
    });

    // Upload QR
    document.getElementById("upload-btn").addEventListener("click", () => {
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*";
      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file && html5QrCode) {
          html5QrCode.scanFileV2(file, true)
            .then((result) => {
              try {
                const upiData = parseUpiQr(result.decodedText);
                showPaymentInterface(upiData);
              } catch (error) {
                alert("Error: " + error.message);
                console.error(error);
              }
            })
            .catch(() => alert("No QR code found in image."));
        }
      };
      fileInput.click();
    });

    // Validate amount input
    document.getElementById('amount-input').addEventListener('input', function(e) {
      const errorEl = document.getElementById('amount-error');
      const value = parseFloat(e.target.value);
      
      if (e.target.value && (isNaN(value) || value <= 0)) {
        errorEl.textContent = 'Invalid amount';
      } else if (currentUpiData.mam && value < parseFloat(currentUpiData.mam)) {
        errorEl.textContent = `Minimum amount is ₹${currentUpiData.mam}`;
      } else {
        errorEl.textContent = '';
      }
    });
  </script>

</body>
</html>
