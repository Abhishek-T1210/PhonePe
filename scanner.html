<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Scan QR - PhonePe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      color: white;
      z-index: 10;
    }
    .close-btn {
      font-size: 24px;
      cursor: pointer;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
    }
    .help-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Video Container */
    #reader {
      width: 100%;
      height: 100%;
    }
    #reader video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Scan Frame Overlay */
    .scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      border: 3px solid #68217A;
      border-radius: 20px;
      pointer-events: none;
      box-shadow: 0 0 30px rgba(104, 33, 122, 0.6);
    }
    .scan-frame::before, .scan-frame::after,
    .scan-frame > div::before, .scan-frame > div::after {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border-color: #68217A;
    }
    .scan-frame::before {
      top: -3px; left: -3px;
      border-top: 6px solid;
      border-left: 6px solid;
    }
    .scan-frame::after {
      top: -3px; right: -3px;
      border-top: 6px solid;
      border-right: 6px solid;
    }
    .scan-frame > div::before {
      bottom: -3px; left: -3px;
      border-bottom: 6px solid;
      border-left: 6px solid;
    }
    .scan-frame > div::after {
      bottom: -3px; right: -3px;
      border-bottom: 6px solid;
      border-right: 6px solid;
    }
    .scan-frame > div { position: absolute; bottom: 0; width: 100%; height: 40px; }

    /* Bottom Controls */
    .bottom-controls {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 60px;
      z-index: 10;
    }
    .control-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-size: 14px;
      gap: 8px;
    }
    .control-icon {
      width: 56px;
      height: 56px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .control-icon img {
      width: 28px;
      height: 28px;
      filter: brightness(0) invert(1);
    }

    /* Logo */
    .logo {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="close-btn" onclick="window.history.back()">×</div>
    <div class="title">Scan any QR</div>
    <div class="help-icon">?</div>
  </div>

  <!-- QR Scanner -->
  <div id="reader"></div>

  <!-- Scan Frame Overlay -->
  <div class="scan-frame"><div></div></div>

  <!-- Bottom Controls -->
  <div class="bottom-controls">
    <div class="control-btn" id="upload-btn">
      <div class="control-icon">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/image.png" alt="Upload">
      </div>
      Upload QR
    </div>
    <div class="control-btn" id="torch-btn">
      <div class="control-icon">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/flashlight.png" alt="Torch">
      </div>
      Torch
    </div>
  </div>

  <!-- Logo -->
  <div class="logo">BHIM | UPI</div>

  <!-- html5-qrcode Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    const html5QrCode = new Html5Qrcode("reader");

    const config = {
      fps: 10,
      qrbox: { width: 260, height: 260 },
      aspectRatio: 1,
      facingMode: "environment" // Uses back camera by default
    };

    // Start scanning with back camera
    html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText, decodedResult) => {
        // On successful scan
        alert("QR Scanned: " + decodedText);
        // You can redirect or process the result here
        // window.location.href = "payment.html?upi=" + decodedText;
        html5QrCode.stop();
      },
      (errorMessage) => {
        // Scan error (optional logging)
        // console.warn(errorMessage);
      }
    ).catch((err) => {
      alert("Unable to access camera: " + err);
    });

    // Torch Toggle
    let torchOn = false;
    document.getElementById("torch-btn").addEventListener("click", () => {
      torchOn = !torchOn;
      html5QrCode.applyVideoConstraints({
        advanced: [{ torch: torchOn }]
      });
    });

    // Upload QR from gallery (file-based scanning)
    document.getElementById("upload-btn").addEventListener("click", () => {
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*";
      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          html5QrCode.scanFileV2(file, true)
            .then((result) => {
              alert("QR from image: " + result.text);
            })
            .catch((err) => {
              alert("No QR found in image");
            });
        }
      };
      fileInput.click();
    });
  </script>

</body>
</html>
