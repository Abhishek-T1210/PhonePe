<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PhonePe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FAFAFA;
      height: 100vh;
      overflow: hidden;
    }

    /* Status Bar Simulation */
    .status-bar {
      height: 44px;
      background: #68217A;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 500;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
    }

    /* Header */
    .header {
      height: 56px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      position: fixed;
      top: 44px; left: 0; right: 0;
      z-index: 999;
    }
    .back-btn { font-size: 24px; cursor: pointer; }
    .title { font-weight: 600; font-size: 17px; }
    .help { font-size: 20px; }

    /* Main Content */
    .container {
      padding: 120px 24px 40px;
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }

    .main-title {
      font-size: 24px;
      font-weight: 700;
      color: #1A1A1A;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 50px;
    }

    /* 4-Digit Passcode Input (Real PhonePe Style) */
    .pin-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 50px;
    }

    .pin-dots {
      display: flex;
      gap: 20px;
    }

    .pin-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #E0E0E0;
      transition: all 0.3s ease;
    }

    .pin-dot.filled {
      background: #68217A;
    }

    .pin-dot.success {
      background: #4CAF50;
      box-shadow: 0 0 0 6px rgba(76, 175, 80, 0.25);
      animation: successPulse 0.6s ease-out;
    }

    @keyframes successPulse {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }

    /* Hidden Input */
    #pinInput {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      cursor: pointer;
    }

    .refresh-icon {
      position: absolute;
      right: -50px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: #68217A;
    }

    /* Proceed Button */
    .proceed-btn {
      width: 100%;
      height: 50px;
      background: #E5E5E5;
      color: #999;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: not-allowed;
      transition: all 0.3s ease;
      margin-bottom: 40px;
    }
    .proceed-btn.active {
      background: #68217A;
      color: white;
      cursor: pointer;
    }

    /* Alternative Link */
    .alt-link {
      font-size: 15px;
      color: #68217A;
      text-decoration: underline;
      font-weight: 500;
    }

    /* Desktop Block */
    .desktop-block {
      display: none;
      position: fixed; inset: 0; background: #68217A; color: white;
      align-items: center; justify-content: center; text-align: center;
      z-index: 9999; padding: 40px; flex-direction: column; gap: 20px;
    }
    @media (min-width: 768px) {
      body > *:not(.desktop-block) { display: none; }
      .desktop-block { display: flex; }
    }
  </style>
</head>
<body>

  <div class="desktop-block">
    <h1>Desktop Not Supported</h1>
    <p>Please use your mobile phone</p>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div>2:52</div>
    <div>Signal Wi-Fi Battery</div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="back-btn">Back</div>
    <div class="title">Continue with PhonePe</div>
    <div class="help">?</div>
  </div>

  <div class="container">
    <h1 class="main-title">Verify your mobile number</h1>
    <p class="subtitle">
      This verifies your identity and helps you securely log in to PhonePe
    </p>

    <h2 style="text-align:left; font-size:18px; margin:30px 0 16px; font-weight:600;">
      Enter 4-digit passcode
    </h2>

    <div class="pin-container">
      <div class="pin-dots" id="pinDots">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <input type="tel" inputmode="numeric" maxlength="4" id="pinInput" autocomplete="off">
      <div class="refresh-icon">Refresh</div>
    </div>

    <button class="proceed-btn" id="proceedBtn" disabled>PROCEED</button>

    <div>
      <a href="#" class="alt-link">Unable to send PIN? Try another way.</a>
    </div>
  </div>

  <script>
    const pinInput = document.getElementById('pinInput');
    pinDots = document.querySelectorAll('.pin-dot');
    proceedBtn = document.getElementById('proceedBtn');

    // Hardcoded correct PIN (change as needed)
    const correctPIN = "1234";

    pinInput.addEventListener('input', () => {
      const value = pinInput.value.replace(/\D/g, '').slice(0,4);
      pinInput.value = value;

      // Update dots
      pinDots.forEach((dot, i) => {
        if (i < value.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });

      // Enable button only when 4 digits
      proceedBtn.disabled = value.length !== 4;
      proceedBtn.classList.toggle('active', value.length === 4);

      // Check if correct
      if (value.length === 4) {
        if (value === correctPIN) {
          // Success: turn dots green with pulse
          pinDots.forEach(dot => {
            dot.classList.remove('filled');
            dot.classList.add('success');
          });
          proceedBtn.classList.add('active');
          // Optional redirect after delay
          // setTimeout(() => location.href = "home.html", 1200);
        } else {
          // Wrong PIN: shake animation
          document.querySelector('.pin-container').style.animation = 'shake 0.5s';
          setTimeout(() => {
            pinInput.value = '';
            pinDots.forEach(d => d.classList.remove('filled', 'success'));
            proceedBtn.disabled = true;
            proceedBtn.classList.remove('active');
            document.querySelector('.pin-container').style.animation = '';
          }, 600);
        }
      }
    });

    // Focus input when clicking anywhere on container
    document.querySelector('.pin-container').addEventListener('click', () => {
      pinInput.focus();
    });

    // Shake animation
    const shakeKeyframes = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        60% { transform: translateX(-10px); }
        80% { transform: translateX(10px); }
      }
    `;
    const style = document.createElement('style');
    style.textContent = shakeKeyframes;
    document.head.appendChild(style);
  </script>
</body>
</html>
