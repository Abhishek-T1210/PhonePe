<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Enter UPI PIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #FFFFFF;
            overflow: hidden;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 14px 20px;
            z-index: 100;
            border-bottom: 1px solid #ddd;
        }
        .cancel-btn {
            font-size: 16px;
            color: #000;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Top row (Bank name + UPI logo) - OUTSIDE the grey bar */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px 0px;
            font-weight: 700;
            background: #FFFFFF;
            margin-top: calc(env(safe-area-inset-top, 50px) + 50px);
        }
        .bank-name {
            font-size: 14px;
            font-weight: 600;
            color: #000000;
        }
        .upi-logo {
            height: 36px;
        }

        /* Grey bar - ONLY the account number inside */
        .account-bar {
            background: #f0f0f0;
            padding: 8px 8px 38px;
        }
        .account-number {
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            letter-spacing: 3px;
            text-align: start;
        }

        /* PIN Section */
        .pin-section {
            padding: 80px 20px 40px;
            text-align: center;
        }
        .pin-title {
            font-size: 14px;
            font-weight: bold;
            color: #504f4f;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 74px;
        }
        .pin-dot {
            width: 20px;
            height: 20px;
            border: 2px solid #bbb;
            border-radius: 50%;
            background: transparent;
        }
        .pin-dot.filled {
            background: #000;
            border-color: #000;
        }
        .pin-note {
            font-size: 12px;
            color: #777;
            line-height: 1.6;
            max-width: 340px;
            margin: 0 auto;
        }

        /* Hidden input for phone numeric keypad */
        #pin-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
            height: 1px;
            width: 1px;
        }

        /* Full-screen Drawer Overlay */
        #drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 9998;
        }
        #drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Full-screen Drawer that slides up */
        #drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100vh;
            width: 100%;
            background: #fff;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 9999;
            overflow-y: auto;
        }
        #drawer.active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Hidden input to trigger phone's numeric keypad -->
    <input 
        type="text" 
        inputmode="numeric" 
        pattern="[0-9]*" 
        maxlength="4" 
        id="pin-input" 
        autocomplete="off"
    />

    <!-- Header -->
    <header class="header">
        <div class="cancel-btn" onclick="history.back()">Cancel</div>
    </header>

    <!-- Top row: Dynamic bank name + short account id + UPI logo -->
    <div class="top-row">
        <div class="bank-info">
            <div class="bank-name" id="bankName">Federal Bank</div>
            <div class="acc-id" id="shortAcc">XXXX2071</div>
        </div>
        <img class="upi-logo" src="upi.svg" alt="UPI">
    </div>

    <!-- Grey bar: Dynamic full account number -->
    <div class="account-bar">
        <div class="account-number" id="fullAcc">XXXXXXXXXX2071</div>
    </div>

    <!-- PIN Section - Clickable area to open keyboard -->
    <div class="pin-section" id="triggerArea">
        <div class="pin-title">Enter 4-digit UPI PIN</div>
        <div class="pin-dots">
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
        </div>
        <div class="pin-note">
            UPI PIN will keep your account secure from unauthorized access. Do not share this PIN with anyone.
        </div>
    </div>

    <!-- Dark overlay (for dimming background) -->
    <div id="drawer-overlay"></div>

    <!-- Full-screen drawer iframe for balance.html -->
    <iframe id="drawer" frameborder="0" scrolling="yes"></iframe>

    <script>
        // Read URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const bankName = urlParams.get('bank') || 'Federal Bank';
        const shortAcc = urlParams.get('short') || 'XXXX2071';
        const fullAcc = urlParams.get('full') || 'XXXXXXXXXX2071';

        document.getElementById('bankName').textContent = bankName;
        document.getElementById('shortAcc').textContent = shortAcc;
        document.getElementById('fullAcc').textContent = fullAcc;

        // PIN handling
        const dots = document.querySelectorAll('.pin-dot');
        const hiddenInput = document.getElementById('pin-input');
        const triggerArea = document.getElementById('triggerArea');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawer-overlay');
        let pin = '';

        // Open keyboard when tapping PIN area
        triggerArea.addEventListener('click', () => {
            hiddenInput.focus();
        });

        // Auto-focus on load
        window.addEventListener('load', () => {
            hiddenInput.focus();
        });

        // Handle PIN input
        hiddenInput.addEventListener('input', (e) => {
            const value = e.target.value.replace(/\D/g, '');
            pin = value.slice(0, 4);
            e.target.value = pin;

            // Update dots
            dots.forEach((dot, index) => {
                if (index < pin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });

            // When 4 digits entered → slide up full-screen balance.html
            if (pin.length === 4) {
                setTimeout(() => {
                    // Load balance.html with parameters
                    drawer.src = 'balance.html?' + window.location.search.slice(1);
                    // Activate drawer and overlay
                    drawer.classList.add('active');
                    overlay.classList.add('active');
                }, 300);
            }
        });
    </script>

</body>
</html>
