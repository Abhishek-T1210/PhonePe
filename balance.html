<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Available Balance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #FFFFFF;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 40px 20px 20px;
            text-align: center;
        }

        /* Pulsing Green Checkmark Circle */
        .checkmark-circle {
            width: 120px;
            height: 186px;
            background: #2f7c33;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            position: relative;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(18, 140, 91, 0.4);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(18, 140, 91, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(18, 140, 91, 0);
            }
        }
        .checkmark {
            width: 28px;
            height: 50px;
            border: solid white;
            border-width: 0 8px 8px 0;
            transform: rotate(45deg);
        }

        /* Success Title */
        .success-title {
            font-size: 22px;
            font-weight: bold;
            color: #000;
            margin-bottom: 40px;
            line-height: 1.3;
        }

        /* Bank Info */
        .bank-info {
            margin-bottom: 30px;
        }
        .bank-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .bank-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
        }
        .bank-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .bank-text {
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }
        .balance-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 4px;
        }
        .balance-amount {
            font-size: 36px;
            font-weight: 500;
            color: #000;
        }

        /* ChatGPT Section */
        .chatgpt-title {
            font-size: 14px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0px 0 27px;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .feature-icon {
            width: 50px;
            height: 50px;
            background: #f7f7f72d;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
             border-radius: 16px;
            border: 1px solid rgb(233, 225, 225);
        }
        .feature-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .feature-text {
            font-size: 12px;
            color: #000;
            text-align: center;
            line-height: 1.3;
        }

        /* Big Square Ad Container - Completely neutral, ready for your image */
        .ad-container {
            width: 100%;
            max-width: 360px;
            height: 360px; /* Perfect square */
            background: #f0f0f0;
            border-radius: 16px;
            overflow: hidden;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ad-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* or 'contain' if you prefer no cropping */
        }

        /* Done Button */
        .done-btn {
            font-size: 18px;
            font-weight: 600;
            color: #68217A;
            text-transform: uppercase;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pulsing Green Checkmark -->
        <div class="checkmark-circle">
            <div class="checkmark"></div>
        </div>

        <!-- Success Message -->
        <div class="success-title">
            Available Balance fetched<br>successfully
        </div>

        <!-- Bank & Balance -->
        <div class="bank-info">
            <div class="bank-row">
                <div class="bank-logo">
                    <img src="federal-bank-app-icon.webp" alt="Bank Logo" id="bankLogo">
                </div>
                <div class="bank-text" id="bankText">Federal Bank • 2071</div>
            </div>
            <div class="balance-label">Available Balance</div>
            <div class="balance-amount">₹1,23,546</div>
        </div>

        <!-- ChatGPT Features - Icon Containers Ready for Images -->
        <div class="chatgpt-title">Explore with ChatGPT</div>
        <div class="features-grid">
            <div class="feature-item">
                <div class="feature-icon">
                    <img src="https://img.icons8.com/ios/50/1A1A1A/light-on--v1.png" alt="Ask Me Anything">
                </div>
                <div class="feature-text">Ask Me<br>Anything</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <img src="https://img.icons8.com/dotty/80/1A1A1A/calculator.png" alt="Plan My Budget">
                </div>
                <div class="feature-text">Plan My<br>Budget</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <img src="https://img.icons8.com/pulsar-line/48/1A1A1A/image.png" alt="Create Any Image">
                </div>
                <div class="feature-text">Create Any<br>Image</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <img src="https://img.icons8.com/ios/50/universe.png" alt="Know Your Astrology">
                </div>
                <div class="feature-text">Know Your<br>Astrology</div>
            </div>
        </div>

        <!-- Big Square Ad Container - Replace with your own ad image -->
        <div class="ad-container">
            <img src="car ad.jpg" alt="Advertisement">
        </div>

        <!-- Done Button -->
        <div class="done-btn" onclick="history.back()">Done</div>
    </div>

   <script>
    // Read parameters from previous page
    const urlParams = new URLSearchParams(window.location.search);
    const bankName = urlParams.get('bank') || 'Federal Bank';
    const shortAcc = urlParams.get('short') || '2071';

    // Update bank text
    document.getElementById('bankText').textContent = `${bankName} • ${shortAcc}`;

    // Fixed balance
    document.querySelector('.balance-amount').textContent = '₹1,23,546';

    // Dynamic Bank Logo
    const bankLogoImg = document.getElementById('bankLogo');

    const bankLogoMap = {
        'HDFC Bank': 'hdfc icon.webp',
        'Federal Bank': 'federal-bank-app-icon.webp',
        'Axis Bank': 'axis.png',
        'Saraswat Bank': 'saraswat.png',
        // Add more banks here
    };

    let logoFile = bankLogoMap[bankName];

    if (!logoFile) {
        logoFile = 'default-bank-logo.png';
    }

    bankLogoImg.src = logoFile;

    // Fallback if image fails to load
    bankLogoImg.onerror = () => {
        bankLogoImg.src = 'default-bank-logo.png';
    };
</script>

</body>
</html>
